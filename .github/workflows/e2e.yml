name: E2E Tests

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

jobs:
  e2e:
    name: Playwright E2E (shard ${{ matrix.partition }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Two shards halve the ~6m wall time and give the CI retry backstop
        # (the CI retries below) headroom under the timeout.
        # Each shard gets its own Postgres service (isolated VMs), and reviews
        # are per-test tokens so shards never share DB state.
        partition: [1, 2]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: assets/package-lock.json

      - name: Restore Elixir dependencies cache
        uses: actions/cache@v6
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: _build/test
          key: ${{ runner.os }}-build-test-e2e-${{ hashFiles('**/mix.lock') }}

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Compile (with E2E pool config)
        run: mix compile
        env:
          E2E: "true"

      - name: Cache Playwright driver and browsers
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/playwright
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-ex-${{ hashFiles('mix.lock') }}

      # On a cache hit this only installs the OS packages.
      - name: Install Playwright driver, browsers and OS deps
        run: mix playwright.install chromium --with-deps

      - name: Install asset dependencies
        run: npm install --prefix assets

      - name: Review page JS unit tests
        run: node --test 'assets/test/*.test.mjs'

      - name: Build assets
        run: mix assets.build

      # The endpoint is served by the test VM itself (test/test_helper.exs).
      # The `||` reruns failures twice (Pierre worker races, slow runners).
      - name: Run Playwright tests
        run: |
          mix test test/e2e --partitions 2 \
            || { [ $? -eq 2 ] && mix test --failed; } \
            || { [ $? -eq 2 ] && mix test --failed; }
        env:
          E2E: "true"
          PHX_SERVER: "true"
          PORT: "4003"
          MIX_TEST_PARTITION: ${{ matrix.partition }}

      - name: Run Playwright security tests
        if: matrix.partition == 2
        run: |
          mix test test/e2e/security_test.exs \
            || { [ $? -eq 2 ] && mix test --failed; } \
            || { [ $? -eq 2 ] && mix test --failed; }
        env:
          E2E: "true"
          PHX_SERVER: "true"
          PORT: "4004"
          PHX_HOST: 127.0.0.1.nip.io
          PREVIEW_HOST: preview.127.0.0.1.nip.io

      - name: Upload test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.partition }}
          path: test-results/
          retention-days: 7
