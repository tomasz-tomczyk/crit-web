name: E2E Tests

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

jobs:
  e2e:
    name: Playwright E2E (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Two shards halve the ~6m wall time and give the CI retry backstop
        # (playwright.config.ts: retries 2 on CI) headroom under the timeout.
        # Each shard gets its own Postgres service (isolated VMs), and reviews
        # are per-test tokens so shards never share DB state.
        shard: ["1/2", "2/2"]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Restore Elixir dependencies cache
        uses: actions/cache@v6
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: _build/test
          key: ${{ runner.os }}-build-test-e2e-${{ hashFiles('**/mix.lock') }}

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Compile (with E2E pool config)
        run: mix compile
        env:
          E2E: "true"

      - name: Install Playwright dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright browser OS deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Install asset dependencies
        run: npm install --prefix assets

      - name: Review page JS unit tests
        run: node --test 'assets/test/*.test.mjs'

      - name: Build assets
        run: mix assets.build

      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shard }}
        env:
          E2E: "true"
          CI: "true"

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
