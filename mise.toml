[tools]
erlang = "28.1"
elixir = "1.19.5-otp-28"

[env]
PORT = "4000"
DB_NAME = "crit_dev"
# Default to 5433 — the host port the crit-web-postgres container maps to
# (5433 host -> 5432 container). This makes `mise exec`/`mise run` work in
# non-interactive shells without anyone exporting DB_PORT. An explicit
# DB_PORT in the environment still overrides (e.g. CI uses 5432).
DB_PORT = "{{ get_env(name='DB_PORT', default='5433') }}"
DB_USER = "postgres"
DB_PASSWORD = "postgres"
DB_HOST = "localhost"

# Worktree config
WT_COPY_DIRS = "deps _build"

[tasks.deps]
description = "Install Elixir dependencies"
run = "mix deps.get"

[tasks."db:start"]
description = "Start PostgreSQL container"
run = """
if docker inspect crit-web-postgres >/dev/null 2>&1; then
  docker start crit-web-postgres 2>/dev/null || true
else
  docker run -d --name crit-web-postgres \
    -e POSTGRES_USER=$DB_USER \
    -e POSTGRES_PASSWORD=$DB_PASSWORD \
    -p $DB_PORT:5432 \
    postgres:17
fi
until docker exec crit-web-postgres pg_isready -U $DB_USER >/dev/null 2>&1; do sleep 0.2; done
"""

[tasks."db:setup"]
description = "Create, migrate, and seed database"
depends = ["deps", "db:start"]
run = [
  "mix ecto.create 2>/dev/null || true",
  "mix ecto.migrate",
  "mix run priv/repo/seeds.exs"
]

[tasks."db:seed"]
description = "Run database seeds"
depends = ["deps", "db:start"]
run = "mix run priv/repo/seeds.exs"

[tasks."assets:upload-article"]
description = "Upload article images to Cloudflare R2 (requires wrangler login + CRIT_ASSETS_BUCKET)"
run = "./scripts/upload-article-assets.sh"

[tasks."assets:upload-newsletter"]
description = "Upload newsletter images to Cloudflare R2 (requires wrangler login + CRIT_ASSETS_BUCKET)"
run = "./scripts/upload-newsletter-assets.sh"

[tasks.up]
description = "Start everything"
depends = ["deps", "db:setup"]
run = "iex -S mix phx.server"
raw = true

[tasks.down]
description = "Stop services"
run = "docker stop crit-web-postgres 2>/dev/null || true"

[tasks.setup]
description = "Install deps and setup DB (no server)"
depends = ["deps", "db:setup"]

[tasks."test:js"]
description = "Run the review page JS unit tests (node --test)"
run = "node --test 'assets/test/*.test.mjs'"

[tasks.e2e]
description = "Run the browser e2e suite (ExUnit with playwright_ex; installs everything it needs first)"
depends = ["deps", "db:start"]
# Mirrors .github/workflows/e2e.yml so a fresh worktree runs the suite with one
# command. Every step is idempotent — a no-op once installed, so reruns are
# fast. test/test_helper.exs serves the endpoint from the test VM itself, so we
# only prep the browser, assets, and the DB container. DB_PORT defaults to 5433
# (host → container 5432) via mise.toml.
#
# `mix deps.compile` runs before `mix compile` because a fresh worktree's
# `_build/test` is copied from the source checkout by `wt step copy-ignored`
# and can be stale (e.g. missing a dep's Erlang parser .beam). `mix compile`
# alone never recompiles deps, so it would inherit the gap; `deps.compile` is
# idempotent and only rebuilds stale deps. CI doesn't need this — it builds
# `_build/test` fresh from cache, never copying a partial one.
usage = 'arg "[args]" help="Extra args forwarded to mix test (e.g. a test file path)" var=#true'
run = """
MIX_ENV=test mix playwright.install chromium
npm install --prefix assets
MIX_ENV=test E2E=true mix deps.compile
MIX_ENV=test E2E=true mix compile
mix assets.build
E2E=true PHX_SERVER=true PORT=4003 mix test ${usage_args:-test/e2e}
"""

[tasks."e2e:security"]
description = "Run the security/origin-isolation e2e tests (needs `mise run e2e` set up first)"
depends = ["db:start"]
run = "E2E=true PHX_SERVER=true PORT=4004 PHX_HOST=127.0.0.1.nip.io PREVIEW_HOST=preview.127.0.0.1.nip.io mix test test/e2e/security_test.exs"
